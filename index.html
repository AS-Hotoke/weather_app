
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherNow - Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="weather-app">
        <h1>WeatherNow</h1>
        <p class="subtitle">Discover the weather in your city</p>

        <form id="weather-form">
            <input
                type="text"
                id="city-input"
                placeholder="Enter city name..."
                aria-label="City name"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <section id="weather-card" class="weather-card" hidden>
            <h2 id="city-name"></h2>
            <img id="weather-icon" src="" alt="Weather icon">
            <h3 id="temperature"></h3>
            <p id="condition"></p>

            <div class="details">
                <div class="detail-box">
                    <span>Humidity</span>
                    <strong id="humidity"></strong>
                </div>
                <div class="detail-box">
                    <span>Feels Like</span>
                    <strong id="feels-like"></strong>
                </div>
            </div>
        </section>

        <footer>Powered by OpenWeatherMap</footer>
    </main>
</body>
</html>
